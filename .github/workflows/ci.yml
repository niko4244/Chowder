name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    name: test linux py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  test-windows:
    name: test windows py3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  quality:
    name: lint build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Critical lint
        run: ruff check src tests
      - name: Compile all Python
        run: python -m compileall -q src tests
      - name: Build wheel and source distribution
        run: python -m build
      - name: Wheel install smoke test
        run: |
          python -m pip install --force-reinstall dist/*.whl
          chowder --help

  real-ml-smoke:
    name: real transformers peft cpu smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHOWDER_REAL_ML_SMOKE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.7"
      - name: Install real training stack
        run: |
          python -m pip install -e ".[train]"
          python -m pip install "pytest>=8,<10"
      - name: Run real train-evaluate-persist smoke
        run: pytest -q tests/test_real_ml_training.py
