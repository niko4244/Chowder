[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chowder-ai"
version = "0.1.0"
description = "Autonomous, evidence-gated post-training experiment engine for local AI hardware."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chowder contributors"}]
dependencies = []

[project.scripts]
chowder = "chowder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
