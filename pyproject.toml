[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chowder-ai"
version = "0.3.0"
description = "Autonomous, evidence-gated post-training experiment engine for local AI hardware."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chowder contributors"}]
dependencies = [
  "textual>=8.2,<9",
]

[project.optional-dependencies]
train = [
  "torch>=2.7",
  "transformers>=5.12,<6",
  "peft>=0.20,<0.21",
  "datasets>=4,<5",
  "accelerate>=1,<2",
]
qlora = [
  "bitsandbytes>=0.50,<0.51",
]
eval = [
  "lm-eval[hf]>=0.4.13,<0.5",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.12,<1",
  "build>=1,<2",
]

[project.scripts]
chowder = "chowder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Correctness gate only: syntax errors, invalid constructs and undefined names.
# Style/unused-import cleanup remains a separate maintenance concern.
select = ["E9", "F63", "F7", "F82"]
